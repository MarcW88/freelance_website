name: Visual design review — usages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "usages/**"
      - "style.css"
      - "DESIGN.md"
      - ".agents/skills/site-design-review/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-design-review-usages.yml"

jobs:
  visual-usages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Capture usage pages
        run: >-
          node .agents/skills/site-design-review/scripts/run-visual-review.mjs
          --route /usages/
          --route /usages/aspirateur-atelier/
          --route /usages/aspirateur-bois-sciure-copeaux/
          --route /usages/aspirateur-bricolage-renovation/
          --route /usages/aspirateur-gravats/
          --route /usages/aspirateur-platre/
          --route /usages/aspirateur-ponceuse/
          --route /usages/aspirateur-scie/
          --output .artifacts/design-review/usages

      - name: Validate usage visual regressions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.artifacts/design-review/usages/report.json', 'utf8'));
          const errors = [];
          if (report.pages.length !== 16) errors.push(`expected 16 viewport captures, got ${report.pages.length}`);
          for (const page of report.pages) {
            const label = `${page.route} (${page.viewport})`;
            if (page.httpStatus !== 200) errors.push(`${label}: HTTP ${page.httpStatus}`);
            if (page.horizontalOverflow) errors.push(`${label}: horizontal overflow`);
            if (page.h1Count !== 1) errors.push(`${label}: H1 count ${page.h1Count}`);
            if ((page.missingHeadingIds || []).length) errors.push(`${label}: headings without id`);
            if ((page.brokenTocTargets || []).length) errors.push(`${label}: broken TOC targets ${page.brokenTocTargets.join(', ')}`);
            if ((page.consoleErrors || []).length) errors.push(`${label}: console errors`);
            if ((page.pageErrors || []).length) errors.push(`${label}: page errors`);
            for (const table of page.tables || []) {
              if (!table.hasExpectedWrapper) errors.push(`${label}: table ${table.index} missing responsive wrapper`);
            }
          }
          if (errors.length) {
            console.error('USAGE_VISUAL_REVIEW: FAIL');
            for (const error of errors) console.error(` - ${error}`);
            process.exit(1);
          }
          console.log('USAGE_VISUAL_REVIEW: PASS');
          console.log(` - ${report.pages.length} desktop/mobile captures checked`);
          NODE

      - name: Upload usage visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-design-review
          path: .artifacts/design-review/usages/
          if-no-files-found: warn
          retention-days: 14

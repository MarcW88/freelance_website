name: Enforce global fr-FR hreflang

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "_generate.py"
      - "apply_hreflang.py"
      - "validate_hreflang.py"
      - ".github/workflows/global-hreflang.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-hreflang-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fr-FR hreflang
        run: python apply_hreflang.py
      - name: Validate hreflang
        run: python validate_hreflang.py
      - name: Commit normalized head tags
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _generate.py apply_hreflang.py validate_hreflang.py
          find . -name index.html -not -path './.git/*' -print0 | xargs -0 git add --
          git commit -m "seo: add self-referencing fr-FR hreflang sitewide"
          git pull --rebase origin main
          git push origin HEAD:main

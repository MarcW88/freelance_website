name: Maintain inline Amazon affiliate links

on:
  push:
    branches: [main]
    paths:
      - 'marques/**'
      - 'bons-plans/**'
      - '.content/products/**'
      - 'apply_inline_affiliate_links.py'
      - 'validate_inline_affiliate_links.py'
      - 'assets/inline-affiliate.css'
      - 'assets/product-cards.css'
      - 'assets/product-affiliate.js'
      - '.github/workflows/maintain-inline-affiliate-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inline-amazon-affiliate-main
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply inline affiliate placements
        run: |
          python -m py_compile apply_inline_affiliate_links.py validate_inline_affiliate_links.py
          python apply_inline_affiliate_links.py

      - name: Validate inline affiliate placements
        run: python validate_inline_affiliate_links.py

      - name: Commit generated inline affiliate placements
        shell: bash
        run: |
          if git diff --quiet -- marques bons-plans; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marques bons-plans
          git commit -m "affiliate: maintain tracked Amazon CTAs"
          git pull --rebase origin main
          git push origin HEAD:main

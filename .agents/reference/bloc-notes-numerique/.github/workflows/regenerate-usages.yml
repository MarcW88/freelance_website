name: Regenerate usage cluster

on:
  push:
    branches: [main]
    paths:
      - 'usage_bespoke_output.py'
      - 'apply_usage_content.py'
      - 'usage_presentation_patch.py'
      - 'usage_content.py'
      - 'usage-workflow.config.yaml'
      - 'validate_usage_workflow.py'
      - '.agents/skills/usage-analysis-workflow/**'
      - '.agents/skills/usage-content-workflow/**'
      - '.github/workflows/regenerate-usages.yml'
      - '_generate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed Usage content
        run: python apply_usage_content.py

      - name: Align Usage hub presentation
        run: python usage_presentation_patch.py

      - name: Apply approved Usage product modules
        run: python apply_product_cards.py usages

      - name: Apply approved Usage indexation
        run: python apply_section_indexation.py usages

      - name: Validate Usage product modules
        run: python validate_product_cards.py usages

      - name: Validate Usage workflow
        run: python validate_usage_workflow.py

      - name: Commit generated editorial pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add sitemap.xml robots.txt
          git commit -m "content: apply reviewed usage cluster"
          git push
